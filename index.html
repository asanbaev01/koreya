<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean & Russian Phrases | Полный разговорник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #0b1120;
    --card-bg: rgba(30, 41, 59, 0.65);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-purple: #a78bfa;
    --accent-pink: #f472b6;
    --border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-color);
    background-image: 
      radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
      radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
      radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 40px 20px;
    color: var(--text-main);
    overflow-x: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding: 20px 0 40px;
    animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  header h1 {
    font-size: 3em;
    font-weight: 800;
    background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc, #f472b6);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 15px;
    letter-spacing: -1px;
    animation: gradientShift 5s ease infinite;
  }

  header p {
    color: var(--text-muted);
    font-size: 1.1em;
    animation: fadeIn 1.5s ease;
  }

  .search-container {
    position: relative;
    margin-bottom: 50px;
    animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s backwards;
  }

  .search-box {
    width: 100%;
    padding: 20px 30px;
    font-size: 1.1em;
    font-family: inherit;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-main);
    outline: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }

  .search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3);
    transform: translateY(-2px);
  }

  .search-box::placeholder { color: var(--text-muted); }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
    gap: 30px;
    align-items: start;
  }

  .category {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    overflow: hidden;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    position: relative;
  }

  .category::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .category:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }

  .category:hover::after { opacity: 1; }

  .category h2 {
    background: rgba(255, 255, 255, 0.03);
    padding: 22px 28px;
    font-size: 1.25em;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    letter-spacing: 0.5px;
  }

  /* 💬 Фразалардын стили */
  .phrase {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .phrase:last-child { border-bottom: none; }

  .phrase-main {
    padding: 20px 28px;
    transition: padding-left 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s;
    position: relative;
  }

  .phrase::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: linear-gradient(to bottom, var(--accent), var(--accent-purple));
    transform: scaleY(0);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    transform-origin: bottom;
    z-index: 10;
  }

  .phrase:hover .phrase-main {
    background: rgba(255, 255, 255, 0.04);
    padding-left: 35px;
  }

  .phrase:hover::before { transform: scaleY(1); }

  .ko {
    font-size: 1.4em;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    transition: color 0.3s;
  }

  .pronunciation {
    font-size: 0.75em;
    color: var(--accent-purple);
    font-weight: 600;
    background: rgba(167, 139, 250, 0.12);
    padding: 4px 12px;
    border-radius: 10px;
    display: inline-block;
    border: 1px solid rgba(167, 139, 250, 0.2);
    transition: all 0.3s ease;
  }

  .phrase:hover .pronunciation {
    background: rgba(167, 139, 250, 0.2);
    transform: scale(1.05);
  }

  .ru {
    color: var(--text-muted);
    font-size: 1.05em;
    margin-top: 4px;
    line-height: 1.4;
  }

  /* 📖 ТҮШҮНДҮРМӨ БӨЛҮГҮ (Аккордеон) */
  .explanation {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, padding 0.4s ease;
    background: rgba(15, 23, 42, 0.4);
    opacity: 0;
  }

  .phrase.active .explanation {
    max-height: 400px;
    opacity: 1;
    padding: 0 28px 20px 28px;
    border-top: 1px dashed rgba(255,255,255,0.1);
    margin-top: 5px;
  }

  .phrase.active .phrase-main {
    background: rgba(56, 189, 248, 0.08);
  }

  .phrase.active::before {
    transform: scaleY(1);
    background: var(--accent);
  }

  .explanation-content {
    padding-top: 15px;
    font-size: 0.95em;
    color: #cbd5e1;
    line-height: 1.6;
    animation: fadeInUp 0.4s ease;
  }

  .explanation-content strong {
    color: var(--accent-pink);
    font-weight: 600;
  }

  .explanation-content .note {
    display: block;
    margin-top: 10px;
    font-size: 0.85em;
    color: var(--text-muted);
    font-style: italic;
    background: rgba(255,255,255,0.03);
    padding: 8px 12px;
    border-radius: 8px;
    border-left: 2px solid var(--accent-purple);
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 0 20px;
    font-size: 0.9em;
    animation: fadeIn 2s ease;
  }

  /* ✨ Анимациялар */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-color); }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 5px; border: 2px solid var(--bg-color); }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* 📱 АДАПТИВДҮҮЛҮК */
  @media (max-width: 1000px) {
    .categories-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 600px) {
    body { padding: 15px 10px; }
    header { padding: 10px 0 25px; }
    header h1 { font-size: 1.8em; }
    header p { font-size: 0.9em; }
    
    .search-container { margin-bottom: 25px; }
    .search-box {
      padding: 14px 18px;
      font-size: 0.95em;
      border-radius: 14px;
    }
    
    .categories-grid { gap: 15px; }
    .category { border-radius: 16px; }
    .category h2 { font-size: 1.05em; padding: 15px 18px; }
    
    .phrase-main { padding: 15px 18px; }
    .phrase:hover .phrase-main { padding-left: 18px; } 
    .phrase:hover::before { display: none; } 
    
    .ko { font-size: 1.15em; gap: 8px; }
    .pronunciation { font-size: 0.7em; padding: 3px 8px; }
    .ru { font-size: 0.9em; }
    
    .phrase.active .explanation {
      padding: 0 18px 15px 18px;
      max-height: 600px; 
    }
    .explanation-content {
      font-size: 0.85em;
      padding-top: 10px;
    }
    .explanation-content .note {
      font-size: 0.8em;
      padding: 6px 10px;
    }
  }
</style>
</head>
<body>

</div>

      { ko: "지하철역", pron: "чихачхольёк", ru: "Станция метро", desc: "В Сеуле метро — самый удобный вид транспорта. Станции обозначены номерами и названиями на корейском и английском.", note: "Оплата картой T-money." }
    ]
  }
];

const container = document.getElementById('phrases');

// 🎨 Рендер функциясы
function render(filter = '') {
  container.innerHTML = '';
  let delay = 0;

  data.forEach(cat => {
    const filtered = cat.items.filter(i =>
      i.ko.toLowerCase().includes(filter.toLowerCase()) ||
      i.pron.toLowerCase().includes(filter.toLowerCase()) ||
      i.ru.toLowerCase().includes(filter.toLowerCase()) ||
      i.desc.toLowerCase().includes(filter.toLowerCase())
    );
    if (filtered.length === 0) return;

    const div = document.createElement('div');
    div.className = 'category';
    div.style.animationDelay = `${delay}s`;
    delay += 0.05;
    
    div.innerHTML = `<h2>${cat.category}</h2>`;
    
    filtered.forEach(item => {
      const p = document.createElement('div');
      p.className = 'phrase';
      
      // Негизги бөлүк
      const mainPart = document.createElement('div');
      mainPart.className = 'phrase-main';
      mainPart.innerHTML = `
        <div class="ko">
          ${item.ko} 
          <span class="pronunciation">[${item.pron}]</span>
        </div>
        <div class="ru">${item.ru}</div>
      `;
      
      // Түшүндүрмө бөлүгү
      const explPart = document.createElement('div');
      explPart.className = 'explanation';
      explPart.innerHTML = `
        <div class="explanation-content">
          ${item.desc}
          <span class="note">💡 ${item.note}</span>
        </div>
      `;
      
      p.appendChild(mainPart);
      p.appendChild(explPart);
      
      // 🖱️ Баскандагы иш-аракет
      p.onclick = () => {
        p.classList.toggle('active');
        navigator.clipboard?.writeText(item.ko);
        
        // Көчүрүлгөндүгүн билдирүү эффектиси
        mainPart.style.background = 'rgba(56, 189, 248, 0.2)';
        setTimeout(() => mainPart.style.background = '', 300);
      };
      
      div.appendChild(p);
    });
    
    container.appendChild(div);
  });
}

// 🔍 Издөө (Debounce)
let searchTimeout;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => render(e.target.value), 150);
});

// Баштоо
render();
</script>
