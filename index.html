<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean & Russian Phrases</title>
<style>
  :root {
    --bg-color: #0b1120;
    --card-bg: rgba(30, 41, 59, 0.6);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-purple: #a78bfa;
    --border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-color);
    background-image: 
      radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
      radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
      radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 40px 20px;
    color: var(--text-main);
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding: 20px 0 40px;
    animation: fadeInDown 0.8s ease-out;
  }

  header h1 {
    font-size: 2.5em;
    font-weight: 800;
    background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 15px;
    letter-spacing: -1px;
  }

  header p {
    color: var(--text-muted);
    font-size: 1.1em;
  }

  .search-box {
    width: 100%;
    padding: 18px 25px;
    font-size: 1.1em;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text-main);
    margin-bottom: 40px;
    outline: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
  }

  .search-box:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }

  .search-box::placeholder {
    color: var(--text-muted);
  }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
    gap: 25px;
    align-items: start;
  }

  .category {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    transition: transform 0.3s ease;
    animation: fadeInUp 0.6s ease-out backwards;
  }

  .category:hover {
    transform: translateY(-2px);
  }

  .category h2 {
    background: rgba(255, 255, 255, 0.05);
    padding: 20px 25px;
    font-size: 1.2em;
    font-weight: 600;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .phrase {
    display: flex;
    flex-direction: column;
    padding: 18px 25px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }

  .phrase:last-child { border-bottom: none; }

  .phrase:hover {
    background: rgba(255, 255, 255, 0.03);
    padding-left: 30px;
  }

  .phrase:hover::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--accent);
    border-radius: 0 4px 4px 0;
  }

  .ko {
    font-size: 1.3em;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pronunciation {
    font-size: 0.85em;
    color: var(--accent-purple);
    font-weight: 500;
    background: rgba(167, 139, 250, 0.1);
    padding: 3px 10px;
    border-radius: 8px;
    display: inline-block;
  }

  .ru {
    color: var(--text-muted);
    font-size: 1.05em;
    margin-top: 5px;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 0 20px;
    font-size: 0.9em;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-color); }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* 📱 АДАПТИВДҮҮЛҮК (Телефон жана планшет үчүн) */
  @media (max-width: 900px) {
    .categories-grid {
      grid-template-columns: 1fr; /* Бир тилкеге өтөт */
    }
  }

  @media (max-width: 600px) {
    body {
      padding: 20px 12px;
    }
    header h1 {
      font-size: 1.8em;
    }
    header p {
      font-size: 0.95em;
    }
    .search-box {
      padding: 14px 20px;
      font-size: 1em;
      margin-bottom: 25px;
    }
    .category h2 {
      font-size: 1.05em;
      padding: 15px 18px;
    }
    .phrase {
      padding: 14px 18px;
    }
    .phrase:hover {
      padding-left: 18px; /* Телефондо жылышпайт */
    }
    .phrase:hover::before {
      display: none; /* Телефондо сызыкча чыкпайт */
    }
    .ko {
      font-size: 1.15em;
      gap: 8px;
    }
    .pronunciation {
      font-size: 0.8em;
      padding: 2px 8px;
    }
    .ru {
      font-size: 0.95em;
    }
  }
</style>
</head>

const container = document.getElementById('phrases');

function render(filter = '') {
  container.innerHTML = '';
  let delay = 0;

  data.forEach(cat => {
    const filtered = cat.items.filter(i =>
      i.ko.toLowerCase().includes(filter.toLowerCase()) ||
      i.pron.toLowerCase().includes(filter.toLowerCase()) ||
      i.ru.toLowerCase().includes(filter.toLowerCase())
    );
    if (filtered.length === 0) return;

    const div = document.createElement('div');
    div.className = 'category';
    div.style.animationDelay = `${delay}s`;
    delay += 0.05;
    
    div.innerHTML = `<h2>${cat.category}</h2>`;
    
    filtered.forEach(item => {
      const p = document.createElement('div');
      p.className = 'phrase';
      
      p.innerHTML = `
        <div class="ko">
          ${item.ko} 
          <span class="pronunciation">[${item.pron}]</span>
        </div>
        <div class="ru">${item.ru}</div>
      `;
      
      p.onclick = () => {
        const text = item.ko;
        navigator.clipboard?.writeText(text);
        
        p.style.background = 'rgba(56, 189, 248, 0.25)';
        setTimeout(() => p.style.background = '', 300);
      };
      
      div.appendChild(p);
    });
    
    container.appendChild(div);
  });
}

document.getElementById('search').addEventListener('input', e => render(e.target.value));
render();
